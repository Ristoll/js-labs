services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      # BUILD_VERSION is set at deploy time to the git tag/SHA so /health
      # reports the running build. Defaults to "dev" locally.
      BUILD_VERSION: dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

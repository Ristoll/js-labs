<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 01</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <div id="controls-hint">
      <kbd>W</kbd>/<kbd>▲</kbd> Forward &bull; <kbd>S</kbd>/<kbd>▼</kbd> Reverse &bull; <kbd>A</kbd>/<kbd>D</kbd>/<kbd>◄</kbd>/<kbd>►</kbd> Turn
    </div>

    <div id="experiment-buttons" title="Milestone 4 Experiments (Results printed in Console)">
      <span class="exp-label">EXP:</span>
      <button id="btn-exp-1" class="exp-btn" title="Run Experiment 1: 100ms Synchronous Freeze">1</button>
      <button id="btn-exp-2" class="exp-btn" title="Run Experiment 2: setInterval vs rAF">2</button>
      <button id="btn-exp-3" class="exp-btn" title="Run Experiment 3: Fixed vs Variable Timestep Trajectory">3</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
